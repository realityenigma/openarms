version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: armswideopen
      POSTGRES_PASSWORD: armswideopen_dev
      POSTGRES_DB: armswideopen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armswideopen"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://armswideopen:armswideopen_dev@db:5432/armswideopen
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:8080"
    environment:
      VITE_API_URL: /api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
