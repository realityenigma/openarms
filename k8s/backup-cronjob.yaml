apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: armswideopen
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: postgres:15-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: armswideopen-secret
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: armswideopen-secret
                      key: POSTGRES_USER
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: armswideopen-secret
                      key: POSTGRES_DB
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  mkdir -p /backup
                  pg_dump -h postgres -U "$POSTGRES_USER" "$POSTGRES_DB" > /backup/backup-$(date +%F-%H%M%S).sql
                  find /backup -type f -name '*.sql' -mtime +7 -delete
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: armswideopen
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
