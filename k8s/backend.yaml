apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-storage-pvc
  namespace: armswideopen
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: armswideopen-backend
  namespace: armswideopen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: armswideopen-backend
  template:
    metadata:
      labels:
        app: armswideopen-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/armswideopen-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: armswideopen-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: armswideopen-secret
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: backend-storage
              mountPath: /app/storage
            - name: csi-secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: backend-storage
          persistentVolumeClaim:
            claimName: backend-storage-pvc
        - name: csi-secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: armswideopen-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: armswideopen-backend
  namespace: armswideopen
spec:
  selector:
    app: armswideopen-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
