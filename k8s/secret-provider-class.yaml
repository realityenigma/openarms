apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: armswideopen-secrets
  namespace: armswideopen
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "armswideopen/production"
        objectType: "secretsmanager"
        jmesPath:
          - path: SECRET_KEY
            objectAlias: SECRET_KEY
          - path: POSTGRES_PASSWORD
            objectAlias: POSTGRES_PASSWORD
  secretObjects:
    - secretName: armswideopen-external-secret
      type: Opaque
      data:
        - objectName: SECRET_KEY
          key: SECRET_KEY
        - objectName: POSTGRES_PASSWORD
          key: POSTGRES_PASSWORD
