[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armswideopen-hub"
version = "0.1.0"
description = "Open-source implementation of Hugging Face Hub"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Arms Wide Open Contributors"}
]
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "alembic==1.13.0",
    "psycopg2-binary==2.9.9",
    "python-multipart==0.0.6",
    "python-jose==3.3.0",
    "passlib==1.7.4",
    "bcrypt==4.1.1",
    "gitpython==3.1.40",
    "requests==2.31.0",
    "aiofiles==23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.23.2",
    "httpx==0.25.2",
    "transformers==4.46.3",
    "black==23.12.1",
    "ruff==0.1.11",
    "mypy==1.7.1",
]

[project.scripts]
armswideopen = "armswideopen.cli:main"
